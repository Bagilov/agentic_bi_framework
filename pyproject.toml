[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-bi-framework"
version = "0.0.1b1"
description = "Self-contained framework for agentic Power BI (.pbix) authoring, validation, brand auditing and report-server operations."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Bagilov" }]
keywords = [
    "powerbi",
    "power-bi",
    "pbix",
    "dax",
    "power-query",
    "semantic-model",
    "lineage",
    "brand-audit",
    "report-server",
    "automation",
    "cli",
    "agentic",
    "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Build Tools",
    "Operating System :: OS Independent",
]

# Core runtime is stdlib-only. Optional integrations are grouped by concern.
dependencies = []

[project.urls]
Homepage = "https://github.com/Bagilov/agentic_bi_framework"
Repository = "https://github.com/Bagilov/agentic_bi_framework"
Changelog = "https://github.com/Bagilov/agentic_bi_framework/releases"

[project.optional-dependencies]
# YAML/JSON declarative specs and brand config.
spec = ["PyYAML>=6.0"]
# Read-back / deep DAX-M analysis of an existing .pbix model.
readback = ["pbixray>=0.4", "pandas>=2.0"]
# Report Server (REST) publish + inspection.
#
# `requests-negotiate-sspi` is Windows-only: it depends on `pywin32`, which ships
# only Windows wheels, so a Linux CI leg can never install it. It also cannot use
# the historical `>=0.4` pin: every sdist up to 0.5.0 declares its version as
# `0.0.0` in its metadata, so `>=0.4` is unsatisfiable and pip exhausts its
# resolution depth backtracking over the whole release history instead of
# failing. 0.5.2 is the first release published as a wheel with a correct
# version, hence the `>=0.5.2` floor. The platform marker keeps the extra
# installable on Linux, where only the REST client (requests/urllib3) is used.
server = [
  "requests>=2.31",
  "urllib3>=2.0",
  "requests-negotiate-sspi>=0.5.2; sys_platform == 'win32'",
]
# Native negotiation (SPNEGO/Negotiate) for on-prem Report Server. The module is
# imported as `spnego`, but the distribution is `pyspnego`: the old `spnego`
# package no longer exists on PyPI (its name was reused and then removed), so
# `spnego>=0.4` cannot resolve on any platform.
server-native = ["pyspnego>=0.10"]
# Brand auditing of .pptx documents.
brand = ["python-pptx>=0.6.23", "lxml>=4.9"]
# Parity export (Excel/Parquet) of lineage tables.
tables = ["pandas>=2.0", "pyarrow>=14.0"]
# Multi-page PDF lineage report (diagram + matrix + brand audit).
report = ["reportlab>=4.0", "Pillow>=10.0", "pandas>=2.0", "openpyxl>=3.1"]
# Binary DataModel (ABF) read/relayout: member-level patching of a .pbix.
binary = ["xpress9>=0.3"]
# Windows guest chain: WinRM to a UTM VM that runs the engine/oracle (see docs).
guest = ["pywinrm>=0.5"]
# Developer tooling: linter/formatter + tests.
# `tomli` back-ports `tomllib` for Python 3.10 (the package floor); the markers
# in the test read `pyproject.toml` with it.
dev = [
  "ruff>=0.6",
  "pytest>=7.4",
  "pytest-cov>=5.0",
  # Bounded so the tracked baseline stays reproducible: the measured 164 errors
  # come from mypy 2.x. An unbounded floor silently re-baselines on every
  # release and, once the ratchet's baseline reaches zero, a checker release
  # that changes semantics breaks the build with no code change.
  "mypy>=1.8,<2.5",
  "tomli>=2.0; python_version < '3.11'",
]
# Everything.
all = [
  "PyYAML>=6.0",
  "pbixray>=0.4",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "requests>=2.31",
  "urllib3>=2.0",
  "requests-negotiate-sspi>=0.5.2; sys_platform == 'win32'",
  "pyspnego>=0.10",
  "python-pptx>=0.6.23",
  "lxml>=4.9",
  "reportlab>=4.0",
  "Pillow>=10.0",
  "xpress9>=0.3",
  "pywinrm>=0.5",
]

[project.scripts]
agentic-bi-engine = "agentic_bi.engine_cli:main"
agentic-bi-test-build = "agentic_bi.test_build:main"
agentic-bi-visual-check = "agentic_bi.visual_check:main"
agentic-bi-brand-audit = "agentic_bi.brand_audit:main"
agentic-bi-lineage = "agentic_bi.lineage.pbi_lineage:main"
agentic-bi-antipatterns = "agentic_bi.antipatterns.pbi_antipatterns:main"
agentic-bi-server = "agentic_bi.reportserver.diagnostics:main"
agentic-bi-report = "agentic_bi.report.pdf_report:main"
agentic-bi-pbix-patch = "agentic_bi.pbix_binary.patch_cli:main"
agentic-bi-web-clone = "agentic_bi.web_report.web_cli:main"
agentic-bi-guest-dashboard = "agentic_bi.guest_chain_cli:main"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]
# Verbatim third-party review transcripts (Markdown with embedded Python) must
# stay byte-for-byte as received, so they are not reformatted.
extend-exclude = ["other/qwen-review"]

[tool.ruff.lint]
# `BLE` makes a blind `except Exception` an explicit, reviewed decision (every
# intentional one carries a `noqa: BLE001` with a reason). `RUF100` keeps those
# directives honest, so one cannot survive after the code it suppressed changed.
select = ["E", "F", "W", "I", "UP", "B", "BLE", "RUF100"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.mypy]
# Report-only (Stage 3 of docs/IMPROVEMENT_PLAN.md): the current count is a
# tracked baseline, not a gate. The dominant code is `attr-defined` on the
# lineage mixins, where `PbiLineage` composes `ModelMixin`/`ExportMixin`/... and
# mypy cannot see the attributes a sibling mixin defines. Those are real
# annotations, not `Any`; they need a shared Protocol, which is a separate
# change. CI runs this step under a baseline ratchet (`MYPY_BASELINE` in
# .github/workflows/ci.yml) so the count cannot grow; when it reaches zero the
# ratchet is replaced by a plain blocking `mypy`.
python_version = "3.10"
files = ["src/agentic_bi"]
# Optional integrations (`pyarrow`, `xpress9`, `pywinrm`, `pbixray`, ...) are
# absent in a stdlib-only environment and the package degrades cleanly, so a
# missing third-party stub is not an error here.
ignore_missing_imports = true
warn_unused_configs = true

[tool.coverage.run]
source = ["agentic_bi"]
branch = false

[tool.coverage.report]
# Ratchet, not a target: the suite measures ~60% locally (macOS, Python 3.12,
# `all` extra) and the same on the Linux CI legs. The floor sits below the
# measured value so a platform-specific skip cannot fail the build, but a real
# regression can. Raise it in the same change that adds the tests, never lower.
fail_under = 58
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# `py.typed` ships the inline type information the package already carries, so a
# consumer's type checker sees the annotations instead of treating the whole
# package as untyped. `_engine_build.ps1` is invoked as a script by
# `engine_host.run_engine_build`, so it is runtime data, not build input.
agentic_bi = ["brand_config.yaml", "_engine_build.ps1", "py.typed"]
